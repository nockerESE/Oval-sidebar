<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oval</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #111110;
      color: #f0efe9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    .header {
      padding: 8px 12px;
      background: #111110;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .header-left { display: flex; align-items: center; gap: 8px; }
    .oval-dot { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; }
    .header h1 { font-size: 12px; font-weight: 500; color: #555; letter-spacing: 0.08em; text-transform: uppercase; }

    .header-btns { display: flex; gap: 4px; -webkit-app-region: no-drag; }
    .header-btns button {
      background: none; border: none; color: #444;
      width: 26px; height: 26px; border-radius: 5px;
      font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, color 0.1s;
    }
    .header-btns button:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .header-btns button.close:hover { background: #922; color: #fff; }

    .urlbar {
      display: flex; gap: 6px; padding: 7px 10px;
      background: #111110;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .urlbar input {
      flex: 1; padding: 6px 10px; font-size: 12px;
      background: #1a1a18; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px; color: #f0efe9; outline: none; font-family: inherit;
      transition: border-color 0.15s;
    }
    .urlbar input:focus { border-color: #1D9E75; }
    .urlbar button {
      padding: 6px 10px; font-size: 13px;
      background: #1a1a18; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px; color: #888; cursor: pointer;
    }
    .urlbar button:hover { background: #222; color: #fff; }

    webview { flex: 1; width: 100%; border: none; }

    /* HOME */
    .home {
      flex: 1; display: flex; flex-direction: column;
      gap: 6px; padding: 12px; overflow-y: auto;
    }

    .section-label {
      font-size: 10px; font-weight: 600; color: #333;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 4px 2px 2px;
    }

    .quick-btns { display: flex; flex-direction: column; gap: 4px; }
    .quick-btns button {
      padding: 9px 12px; font-size: 13px;
      background: #1a1a18; border: 1px solid rgba(255,255,255,0.05);
      border-radius: 7px; color: #999; cursor: pointer;
      text-align: left; transition: background 0.1s, color 0.1s;
      font-family: inherit; width: 100%;
    }
    .quick-btns button:hover { background: #222; color: #fff; border-color: rgba(255,255,255,0.1); }

    .shortcut-hint {
      font-size: 10px; color: #222; text-align: center; padding-top: 4px;
    }
    kbd {
      background: #1a1a18; border: 1px solid #222;
      border-radius: 3px; padding: 1px 4px; font-size: 9px; color: #2a2a28;
    }

    /* KALKULATOR FULLSCREEN */
    .calc-view {
      flex: 1; display: none; flex-direction: column; background: #111110;
    }

    .calc-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .calc-topbar span { font-size: 12px; color: #555; }
    .calc-topbar button {
      background: none; border: none; color: #444; font-size: 13px;
      cursor: pointer; padding: 4px 8px; border-radius: 5px;
    }
    .calc-topbar button:hover { background: rgba(255,255,255,0.07); color: #fff; }

    .calc-display {
      padding: 16px 16px 10px; text-align: right; flex-shrink: 0;
    }
    .calc-expr { font-size: 12px; color: #333; min-height: 18px; word-break: break-all; }
    .calc-result { font-size: 36px; font-weight: 300; color: #f0efe9; letter-spacing: -1px; min-height: 44px; word-break: break-all; }

    .calc-grid {
      flex: 1; display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 1px; background: rgba(255,255,255,0.04);
    }

    .calc-grid button {
      font-size: 16px; border: none;
      background: #1a1a18; color: #ccc;
      cursor: pointer; font-family: inherit;
      transition: background 0.1s;
    }
    .calc-grid button:hover { background: #252523; color: #fff; }
    .calc-grid button:active { background: #2e2e2c; }
    .calc-grid button.op { color: #1D9E75; }
    .calc-grid button.eq { background: #1D9E75; color: #fff; }
    .calc-grid button.eq:hover { background: #18866a; }
    .calc-grid button.clear { color: #e05; }
    .calc-grid button.span2 { grid-column: span 2; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="oval-dot"></div>
      <h1>Oval</h1>
    </div>
    <div class="header-btns">
      <button onclick="hideApp()" title="Sembunyikan">−</button>
      <button class="close" onclick="quitApp()" title="Keluar">✕</button>
    </div>
  </div>

  <div class="urlbar">
    <input type="text" id="urlInput" placeholder="Ketik URL atau kata kunci..." />
    <button onclick="navigate()">→</button>
  </div>

  <!-- HOME -->
  <div class="home" id="homeScreen">
    <div class="section-label">Cepat</div>
    <div class="quick-btns">
      <button onclick="loadUrl('https://google.com')">🔍  Google</button>
      <button onclick="loadUrl('https://youtube.com')">▶  YouTube</button>
      <button onclick="loadUrl('https://claude.ai')">◆  Claude</button>
      <button onclick="loadUrl('https://translate.google.com')">🌐  Translate</button>
      <button onclick="showCalc()">🧮  Kalkulator</button>
    </div>
    <div class="shortcut-hint">Show/hide: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd></div>
  </div>

  <!-- KALKULATOR -->
  <div class="calc-view" id="calcView">
    <div class="calc-topbar">
      <span>Kalkulator</span>
      <button onclick="goHome()">← Kembali</button>
    </div>
    <div class="calc-display">
      <div class="calc-expr" id="calcExpr"></div>
      <div class="calc-result" id="calcResult">0</div>
    </div>
    <div class="calc-grid">
      <button class="clear" onclick="calcClear()">AC</button>
      <button class="op" onclick="calcToggleSign()">±</button>
      <button class="op" onclick="calcPercent()">%</button>
      <button class="op" onclick="calcInput('/')">÷</button>

      <button onclick="calcInput('7')">7</button>
      <button onclick="calcInput('8')">8</button>
      <button onclick="calcInput('9')">9</button>
      <button class="op" onclick="calcInput('*')">×</button>

      <button onclick="calcInput('4')">4</button>
      <button onclick="calcInput('5')">5</button>
      <button onclick="calcInput('6')">6</button>
      <button class="op" onclick="calcInput('-')">−</button>

      <button onclick="calcInput('1')">1</button>
      <button onclick="calcInput('2')">2</button>
      <button onclick="calcInput('3')">3</button>
      <button class="op" onclick="calcInput('+')">+</button>

      <button class="span2" onclick="calcInput('0')">0</button>
      <button onclick="calcInput('.')">.</button>
      <button class="eq" onclick="calcEquals()">=</button>
    </div>
  </div>

  <webview id="webview" style="display:none" src="" allowpopups></webview>

  <script>
    const webview = document.getElementById('webview')
    const urlInput = document.getElementById('urlInput')
    const homeScreen = document.getElementById('homeScreen')
    const calcView = document.getElementById('calcView')
    const calcResult = document.getElementById('calcResult')
    const calcExpr = document.getElementById('calcExpr')

    let expr = ''
    let justCalc = false

    function showCalc() {
      homeScreen.style.display = 'none'
      webview.style.display = 'none'
      calcView.style.display = 'flex'
    }

    function goHome() {
      homeScreen.style.display = 'flex'
      webview.style.display = 'none'
      calcView.style.display = 'none'
      urlInput.value = ''
    }

    function navigate() {
      let url = urlInput.value.trim()
      if (!url) return
      if (!url.startsWith('http')) url = 'https://' + url
      loadUrl(url)
    }

    function loadUrl(url) {
      urlInput.value = url
      homeScreen.style.display = 'none'
      calcView.style.display = 'none'
      webview.style.display = 'flex'
      webview.src = url
    }

    function hideApp() { window.close() }

    function quitApp() {
      const { ipcRenderer } = require('electron')
      ipcRenderer.send('quit-app')
    }

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigate()
    })

    webview.addEventListener('did-navigate', (e) => {
      urlInput.value = e.url
    })

    // KALKULATOR
    function calcInput(val) {
      if (justCalc && !isNaN(val)) { expr = ''; justCalc = false }
      expr += val
      justCalc = false
      try {
        const r = eval(expr)
        if (r !== undefined && !isNaN(r)) calcResult.textContent = r
      } catch(e) {}
      calcExpr.textContent = expr.replace(/\*/g,'×').replace(/\//g,'÷')
    }

    function calcEquals() {
      try {
        const r = eval(expr)
        calcExpr.textContent = expr.replace(/\*/g,'×').replace(/\//g,'÷') + ' ='
        expr = String(r)
        calcResult.textContent = r
        justCalc = true
      } catch(e) { calcResult.textContent = 'Error' }
    }

    function calcClear() {
      expr = ''; calcResult.textContent = '0'; calcExpr.textContent = ''; justCalc = false
    }

    function calcToggleSign() {
      try {
        const r = eval(expr)
        expr = String(r * -1)
        calcResult.textContent = expr
        calcExpr.textContent = expr
      } catch(e) {}
    }

    function calcPercent() {
      try {
        const r = eval(expr)
        expr = String(r / 100)
        calcResult.textContent = expr
        calcExpr.textContent = expr
      } catch(e) {}
    }
  </script>

</body>
</html>
